# Enumerations. Integer columns in snapshots index into these lists (0-based).
# Append only; never reorder. Copied verbatim into rollout headers as `enums`.
schema_version: 1

patient_state:
  - waiting_triage      # 0 arrived, in waiting room, not yet triaged
  - in_triage           # 1 with triage nurse
  - waiting_bay         # 2 triaged, waiting for a treatment space
  - waiting_provider    # 3 in a bay, waiting for first provider contact
  - with_provider       # 4 clinician encounter in progress (the playable interaction)
  - waiting_test        # 5 waiting for imaging / lab
  - in_test             # 6 at imaging
  - waiting_results     # 7 back in bay, waiting for results and disposition
  - boarding            # 8 admitted, holding in an ED bay for an inpatient bed
  - in_ward             # 9 in an inpatient bed
  - walking             # 10 moving between rooms
  - exited              # 11 left the hospital this tick (see patient_exit)

patient_exit:           # every arrival ends in exactly one of these
  - none                # 0 still in the hospital
  - discharged_ed       # 1 treated and discharged from the ED
  - discharged_ward     # 2 admitted, completed inpatient stay
  - lwbs                # 3 left without being seen
  - transferred         # 4 transferred out
  - died                # 5
  - diverted            # 6 ambulance diverted before arrival (never entered)

acuity: [esi1, esi2, esi3, esi4, esi5]   # column holds 1..5, not an index

condition_group:
  - chest_pain
  - respiratory
  - abdominal_pain
  - injury_trauma
  - neuro
  - infection_fever
  - mental_health_substance
  - musculoskeletal
  - other_medical

arrival_mode: [walk_in, ambulance, transfer]
age_band: [age_0_17, age_18_44, age_45_64, age_65_plus]
payer: [medicare, medicaid, commercial, self_pay, other]

staff_role:
  - attending
  - resident
  - app                 # nurse practitioner / physician assistant
  - rn
  - charge_rn
  - tech
  - registration
  - pharmacist
  - imaging_tech
  - transport
  - evs                 # cleaning

staff_state: [off_shift, idle, busy, walking, on_break]

room_type:
  - waiting_room
  - triage
  - treatment_bay
  - resus_bay
  - fast_track
  - results_waiting
  - xray
  - ct
  - mri
  - ultrasound
  - lab
  - pharmacy
  - operating_room
  - recovery
  - icu_bed
  - stepdown_bed
  - ward_unit
  - ambulance_bay
  - entrance
  - nurse_station
  - corridor
  - decon
  - peds_ed
  - support             # staff, storage, admin

room_status: [closed, open_empty, occupied, cleaning, out_of_service]

equipment_type: [ct, mri, xray, ultrasound, monitor, ventilator, lab_analyzer]
equipment_status: [idle, in_use, down, off]

interaction_type:
  - triage
  - clinician_encounter
  - nursing_assessment
  - imaging_test
  - lab_test
  - handoff
  - disposition
  - discharge_planning
  - manager_decision

resolver: [sampled, played]

# catalog
source_tag: [measured, literature, assumed]
# layout
provenance_tag: [surveyed, published, inferred]
# managers
manager_kind: [learned, tuned_heuristic, rule_based, fixed, random, human]
# encounter (teammate's vocabulary)
objective_result: [met, partly_demonstrated, not_observed, not_assessable]
disclosure_rule: [volunteered, if_asked, after_rapport, denied_until_confronted, chart_initial, on_request]
case_status: [draft, approved, published]
