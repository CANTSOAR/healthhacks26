# Literature-backed parameter ranges for the HospitalGym simulator and RL workstreams.
# Written by the overnight operations-research agent, 2026-10-10. Shape per entry:
#   parameter: {value, low, high, unit, source_title, url, note}
# `evidence` is the record id in research/operations-evidence.md. `derived: true` means the research agent
# computed the number from a published table (approximation, not a published estimate).
# `catalog` names the catalog attribute that carries this value, when one exists.
# Every source was fetched and read; see operations-evidence.md for design, sample and limitations.

# ---------------------------------------------------------------- leaving without being seen
