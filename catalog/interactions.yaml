# Catalog file. Shape: contracts/catalog.schema.json. Every attribute carries a source tag
# (measured | literature | assumed). Wave 0 skeleton: all values are ASSUMED placeholders until the
# data workstream replaces them. Keys are read by the simulator; do not rename, only add.
schema_version: 1
entity_type: interaction
description: Interaction declarations (contracts/interaction.schema.json#/$defs/declaration). Every type has a sampler; `played.available` marks
  those with a human-playable resolver.
declarations:
- type: triage
  label: Triage assessment
  participants:
  - role: patient
  - role: rn
    playable: true
  inputs:
    truth:
    - condition
    - severity
    known:
    - chief_complaint
    - arrival_mode
  outputs:
  - duration_min
  - information_gained
  - decision
  - quality
  sampler:
    duration: patient/<esi>/triage_min
    decision: acuity = true acuity with mis-triage probability
    quality: staff skill x fatigue
  played:
    available: false
- type: clinician_encounter
  label: Clinician sees patient
  participants:
  - role: patient
  - role: attending
    playable: true
  inputs:
    truth:
    - facts
    - severity
    - true_disposition
    - needs
    known:
    - triage_note
    - vitals
  outputs:
  - duration_min
  - information_gained
  - decision
  - quality
  sampler:
    duration: patient/<esi>/provider_initial_min
    decision: orders from needs, disposition from true_disposition with error by quality
    quality: staff skill x fatigue
  played:
    available: true
    resolver: encounter.resolver:ClinicianEncounterResolver
    learner_role: attending
- type: imaging_test
  label: Imaging study
  participants:
  - role: patient
  - role: imaging_tech
  inputs:
    truth:
    - facts
    known:
    - orders
  outputs:
  - duration_min
  - information_gained
  - decision
  - quality
  sampler:
    duration: equipment/<type>/procedure_min
  played:
    available: false
- type: disposition
  label: Re-evaluation and disposition
  participants:
  - role: patient
  - role: attending
  inputs:
    truth:
    - true_disposition
    known:
    - results_ready
  outputs:
  - duration_min
  - information_gained
  - decision
  - quality
  sampler:
    duration: patient/<esi>/provider_reeval_min
  played:
    available: false
- type: handoff
  label: ED to ward handoff
  participants:
  - role: rn
  - role: rn
  inputs:
    truth: []
    known:
    - known_fact_ids
  outputs:
  - duration_min
  - information_gained
  - decision
  - quality
  sampler:
    duration: assumed 10 min
  played:
    available: false
- type: manager_decision
  label: Manager changes a setting
  participants:
  - role: manager
    playable: true
  inputs:
    truth: []
    known:
    - observation
  outputs:
  - decision
  sampler:
    decision: policy
  played:
    available: true
    resolver: web play mode
    learner_role: manager
variants: {}
