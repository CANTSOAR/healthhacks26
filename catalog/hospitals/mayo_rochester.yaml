      case-mix index 2.7522, uncompensated-care amount per claim 0.0); operating = (labor*wage_index + nonlabor) * (1 + TCHOP + DSHOPP); capital = capital_rate
      * GAF * (1 + TCHCP + DSHCPP); payment(weight) = (operating + capital) * weight + UCP per claim. Outliers, VBP/readmission/HAC adjustments, new-technology
      add-ons, transfers and any hospital-specific (sole community / Medicare-dependent) rate are ignored.'
    url: https://www.cms.gov/medicare/payment/prospective-payment-systems/acute-inpatient-pps/fy-2027-ipps-final-rule-home-page
    file: data/processed/hospitals/240010/cms_rates.json
    range:
    - 9561
    - 26314
    note: 'Medicare fee-for-service basis (other payers through payer_revenue_multiplier). BASE-RATE ASSUMPTION: the stay is paid at this hospital''s average
      Medicare case-mix index (2.7522, all Medicare discharges); medical admissions through the ED are on average lighter, so this is an upper estimate
      - lower end of range = a DRG weight of 1.0. Payment per unit of DRG weight = 9561 usd. The Impact File lists a hospital-specific rate (10793.51; provider
      type 17): such hospitals are paid the higher of the federal and the hospital-specific rate, and only the federal rate is modelled here. Cross-check:
      the cost report gives net patient revenue 3,892,370,275 usd x inpatient share of gross revenue 0.492 (Worksheet G-2 line 28) / 50,498 discharges =
      about 37,893 usd per discharge, all payers.'
