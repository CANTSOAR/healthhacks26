# Catalog file. Shape: contracts/catalog.schema.json. Every attribute carries a source tag
# (measured | literature | assumed). Wave 0 skeleton: all values are ASSUMED placeholders until the
# data workstream replaces them. Keys are read by the simulator; do not rename, only add.
schema_version: 1
entity_type: hospital
description: Robert Wood Johnson University Hospital, New Brunswick NJ - a MODEL built from public information. Not affiliated with or endorsed
  by the hospital. Patient flows, staffing and outcomes are simulated, not the hospital's operational data. Staff are fictional.
layout_file: catalog/hospitals/rwjuh_nb.layout.json
