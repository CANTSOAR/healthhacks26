        unit: spaces
        source: literature
        citation: '''17 private pediatric patient bays with three dedicated bays for behavioral health'' - Wikipedia, The Bristol-Myers Squibb
          Children''s Hospital (https://en.wikipedia.org/wiki/The_Bristol-Myers_Squibb_Children%27s_Hospital, fetched 2026-10-10), a secondary source
          citing local press that could not be opened; separate pediatric ED is stated by the hospital. Pediatric stream not simulated in v1'
      adult_main_bays:
        value: 68
        unit: bays
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; remainder of ~100 after resus, fast track, peds
      hallway_overflow_spaces:
        value:
        - 0
        - 8
        - 16
        unit: spaces
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; overflow_bays action levels
        index: level
      triage_rooms:
        value: 3
        unit: rooms
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; assumed
      ambulance_bay_slots:
        value: 8
        unit: ambulances
        source: literature
        citation: 'hospital ED expansion page: ambulance bay for eight ambulances'
      ct_scanners_ed:
        value: 2
        unit: units
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; radiology inside the department is published; count assumed
      xray_rooms_ed:
        value: 2
        unit: units
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; assumed
      ultrasound_units:
        value: 2
        unit: units
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; assumed
      mri_units:
        value: 1
        unit: units
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; assumed, main radiology
      licensed_beds:
        value: 700
        unit: beds
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; public description '700+ bed adult hospital'; replace with CMS POS/HCRIS
          count
