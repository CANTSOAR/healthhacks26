# Catalog file. Shape: contracts/catalog.schema.json. Every attribute carries a source tag
# (measured | literature | assumed). Wave 0 skeleton: all values are ASSUMED placeholders until the
# data workstream replaces them. Keys are read by the simulator; do not rename, only add.
schema_version: 1
entity_type: hospital
description: Robert Wood Johnson University Hospital, New Brunswick NJ - a MODEL built from public information. Not affiliated with or endorsed
  by the hospital. Patient flows, staffing and outcomes are simulated, not the hospital's operational data. Staff are fictional.
layout_file: catalog/hospitals/rwjuh_nb.layout.json
variants:
  rwjuh_nb:
    label: RWJUH New Brunswick (model)
    attributes:
      ed_visits_per_year:
        value: 95000
        unit: visits/year
        source: literature
        citation: '''RWJUH currently cares for more than 95,000 emergency department and trauma patients annually'' - hospital ED expansion FAQ,
          https://rwjbh.org/rwj-university-hospital-new-brunswick/about/emergency-department-expansion/frequently-asked-questions (fetched 2026-10-10)'
        note: calibration anchor
      ed_area_sqft:
        value: 60000
        unit: sq ft
        source: literature
        citation: '''expands RWJUH''s current Emergency Department from 40,000 to 60,000 square feet'' - https://www.rwjbh.org/rwj-university-hospital-new-brunswick/about/emergency-department-expansion
          (fetched 2026-10-10)'
      ed_treatment_spaces:
        value: 100
        unit: spaces
        source: literature
        citation: '''more than 100 private treatment areas'' (hospital ED expansion page); split across zones is assumed'
      resus_bays:
        value: 6
        unit: bays
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; 3 added in phase one per the hospital; total assumed
      fast_track_spaces:
        value: 10
        unit: spaces
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; zone published, count assumed
      peds_ed_spaces:
