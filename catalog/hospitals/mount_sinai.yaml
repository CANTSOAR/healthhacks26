      Medicare case-mix index (2.7222, all Medicare discharges); medical admissions through the ED are on average lighter, so this is an upper estimate
      - lower end of range = a DRG weight of 1.0. Payment per unit of DRG weight = 14016 usd. Cross-check: the cost report gives net patient revenue 3,634,097,458
