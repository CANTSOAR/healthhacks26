    source: measured
    citation: 'CMS IPPS FY 2027 final rule + correction notice: Tables 1A/1D standardized amounts (labor 4519.68, nonlabor 2328.32, capital 539.95) and
      Impact File row for CCN 330024 (wage index 1.4269, teaching factor 0.42163, DSH factor 0.06274, capital GAF 1.2756416622587838, transfer-adjusted
      case-mix index 2.7222, uncompensated-care amount per claim 857.6); operating = (labor*wage_index + nonlabor) * (1 + TCHOP + DSHOPP); capital = capital_rate
      * GAF * (1 + TCHCP + DSHCPP); payment(weight) = (operating + capital) * weight + UCP per claim. Outliers, VBP/readmission/HAC adjustments, new-technology
      add-ons, transfers and any hospital-specific (sole community / Medicare-dependent) rate are ignored.'
