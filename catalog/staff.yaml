# Catalog file. Shape: contracts/catalog.schema.json. Every attribute carries a source tag
# (measured | literature | assumed). Wave 0 skeleton: all values are ASSUMED placeholders until the
# data workstream replaces them. Keys are read by the simulator; do not rename, only add.
schema_version: 1
entity_type: staff
description: 'Staff roles. Named individuals are fictional (organizer clinician profiles when present in .private/, built-in stand-ins otherwise).
  Target sources: BLS OEWS wages, state nurse-ratio regulations, BLS absence rates, literature for productivity and fatigue.'
shared:
  overtime_multiplier:
    value: 1.5
    unit: x wage
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; standard time-and-a-half
  agency_premium_multiplier:
    value: 2.0
    unit: x wage
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder agency bill-rate premium
  benefits_load:
    value: 1.28
    unit: x wage
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder benefits loading
  shift_hours:
    value: 8
    unit: hours
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; three 8-hour shifts 07-15, 15-23, 23-07 (many EDs run 12s; simplified)
  absence_rate:
    value: 0.035
    unit: fraction of scheduled shifts
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder unplanned absence rate
  fatigue_gain_per_busy_hour:
    value: 0.06
    unit: index/hour
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  fatigue_recovery_per_idle_hour:
    value: 0.1
    unit: index/hour
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  fatigue_speed_penalty:
    value: 0.25
    unit: fraction slower at fatigue=1
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  fatigue_error_multiplier:
    value: 2.0
    unit: x error rate at fatigue=1
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  annual_turnover:
    value: 0.18
    unit: fraction/year
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  callin_delay_min:
    value: 60
    unit: minutes
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  rn_patients_per_nurse_max:
    value: 4
    unit: patients/nurse
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; placeholder ED ratio (California regulation is 1:4 ED; NJ has no mandated ratio)
      - to verify
  provider_levels:
    value:
    - 3
    - 5
    - 7
    - 9
    - 11
    unit: providers on shift
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; action levels lvl0..lvl4 for md_* heads (day); evening/night scale 1.0/0.6
    index: level
  rn_levels:
    value:
    - 12
    - 17
    - 22
    - 27
    - 32
    unit: nurses on shift
    source: assumed
    citation: Placeholder set in Wave 0 so the simulator can run; action levels lvl0..lvl4 for rn_* heads
    index: level
