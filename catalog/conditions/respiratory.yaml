# Condition template (catalog/conditions). SYNTHETIC teaching content authored for HospitalGym; needs faculty review.
# Generated by encounter/tools/build_templates.py - edit there or here; `facts` is read by the simulator (latent truth)
# and by encounter.templates.instantiate_case. Reference intervals: see `sources`. Everything else: authored, unsourced.
schema_version: 1
entity_type: condition
id: respiratory
condition_group: respiratory
label: Cough and shortness of breath
description: Adult with cough, wheeze or shortness of breath, from a mild asthma flare to pneumonia with low oxygen.
synthetic: true
needs_faculty_review: true
authoring_note: Synthetic teaching template authored for HospitalGym. Reference intervals follow the listed open-access sources; abnormal-band values, wording, findings
  and artifacts are authored, unsourced, and need faculty review before teaching use.
variants:
  mild:
    label: Mild (severity below 1/3)
    attributes:
      severity_range:
        value:
        - 0.0
        - 0.333
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  moderate:
    label: Moderate (severity 1/3 to 2/3)
    attributes:
      severity_range:
        value:
        - 0.333
        - 0.667
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  severe:
    label: Severe (severity above 2/3)
    attributes:
      severity_range:
        value:
        - 0.667
        - 1.0
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
complaint_label: shortness of breath
match_keywords:
- shortness of breath
- breathless
- cough
- coughing
- cough and fever
- wheeze
- asthma
- copd
- pneumonia
- breathing
- sob
- respiratory
diagnoses:
- band: mild
  diagnosis: Mild asthma exacerbation
  expected_disposition: discharge
  expected_orders:
  - exam:lungs
  differential:
  - Asthma flare
  - Viral bronchitis
  label: Mild asthma exacerbation
- band: moderate
  diagnosis: Community-acquired pneumonia
  expected_disposition: discharge
  expected_orders:
  - exam:lungs
  - order:chest_xray
  differential:
  - Pneumonia
  - Asthma or COPD exacerbation
  - Pulmonary embolism
  label: Community-acquired pneumonia
- band: severe
  diagnosis: Severe community-acquired pneumonia with hypoxaemia
  expected_disposition: admit
  expected_orders:
  - exam:lungs
  - order:chest_xray
  - order:cbc
  - order:lactate
  differential:
  - Severe pneumonia
  - Sepsis
  - Pulmonary embolism
  - Heart failure
  label: Severe community-acquired pneumonia with hypoxaemia
teaching_points:
- Cough, fever, chills and sharp chest pain on breathing suggest pneumonia; listen for crackles and get a chest X-ray.
- Low oxygen saturation changes the disposition.
- Ask how inhalers are actually used, not whether they are prescribed.
typical_concealments:
- f.concealed.inhaler_and_smoking
