# Condition template (catalog/conditions). SYNTHETIC teaching content authored for HospitalGym; needs faculty review.
# Generated by encounter/tools/build_templates.py - edit there or here; `facts` is read by the simulator (latent truth)
# and by encounter.templates.instantiate_case. Reference intervals: see `sources`. Everything else: authored, unsourced.
schema_version: 1
entity_type: condition
id: injury_trauma
condition_group: injury_trauma
label: Injury after a fall or twist
description: Adult with a limb or head injury, from an ankle sprain to a hip fracture with head injury on a blood thinner.
synthetic: true
needs_faculty_review: true
authoring_note: Synthetic teaching template authored for HospitalGym. Reference intervals follow the listed open-access sources; abnormal-band values, wording, findings
  and artifacts are authored, unsourced, and need faculty review before teaching use.
variants:
  mild:
    label: Mild (severity below 1/3)
    attributes:
      severity_range:
        value:
        - 0.0
        - 0.333
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  moderate:
    label: Moderate (severity 1/3 to 2/3)
    attributes:
      severity_range:
        value:
        - 0.333
        - 0.667
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  severe:
    label: Severe (severity above 2/3)
    attributes:
      severity_range:
        value:
        - 0.667
        - 1.0
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
complaint_label: injury
match_keywords:
- fall
- fell
- injury
- trauma
- fracture
- sprain
- ankle
- wrist
- hip
- head injury
- accident
- wound
- gunshot
- laceration
diagnoses:
- band: mild
  diagnosis: Lateral ankle sprain
  expected_disposition: discharge
  expected_orders:
  - exam:msk
  differential:
  - Ankle sprain
  - Ankle fracture
  label: Lateral ankle sprain
- band: moderate
  diagnosis: Distal radius fracture
  expected_disposition: discharge
  expected_orders:
  - exam:msk
  - order:xray
  differential:
  - Distal radius fracture
  - Scaphoid fracture
  - Wrist sprain
  label: Distal radius fracture
- band: severe
  diagnosis: Femoral neck fracture with minor head injury on anticoagulation
  expected_disposition: admit
  expected_orders:
  - exam:msk
  - exam:neuro
  - order:xray
  - order:ct_head
  differential:
  - Hip fracture
  - Intracranial bleeding
  - Syncope as the cause of the fall
  label: Femoral neck fracture with minor head injury on anticoagulation
teaching_points:
- Ask why the patient fell, not only what hurts.
- A head injury in someone on a blood thinner needs imaging and observation.
- Decision rules can avoid X-rays in ankle injuries when the patient can walk and has no bony tenderness (authored, unsourced summary).
typical_concealments:
- f.concealed.alcohol_before_fall
