  topics:
  - ct head
  patient_knows: false
  disclosure:
    rule: on_request
    request: order:ct_head
  critical: true
  discoverable_by:
  - imaging_test
  - clinician_encounter
  kind: choice
  options:
    any:
    - statement: 'CT head: no bleeding, no skull fracture'
  chart_section: imaging
  include:
    min_severity: 0.67
  values:
  - 'CT head: no bleeding, no skull fracture'
- fact_id: f.lab.ethanol
  category: lab
  topics:
  - alcohol level
  patient_knows: false
  disclosure:
    rule: on_request
    request: order:ethanol
  critical: false
  discoverable_by:
  - lab_test
  - clinician_encounter
  kind: numeric
  label: Blood alcohol
  unit: '%'
  ranges:
    mild:
    - 0.0
    - 0.0
    moderate:
    - 0.09
    - 0.14
    severe:
    - 0.1
    - 0.19
  decimals: 2
  statement: Blood alcohol level {value}%
  ref_high: 0.0
  ref_range: not detected (0.08% is the usual legal driving limit)
  source_ids:
  - medlineplus_bac
  chart_section: labs
  include:
    requires: f.concealed.alcohol_before_fall
  by_severity:
    mild:
      range:
      - 0.0
      - 0.0
    moderate:
      range:
      - 0.09
      - 0.14
    severe:
      range:
      - 0.1
      - 0.19
artifacts:
- artifact_id: art.xray
  kind: xray
  title: X-ray (report)
  section_id: imaging
  release:
    rule: on_request
    request: order:xray
  content:
    from_fact: f.imaging.xray
  interpretation: Correlate with the examination and neurovascular status.
  linked_fact_ids:
  - f.imaging.xray
  synthetic: true
- artifact_id: art.ct_head
  kind: ct
  title: CT head (report)
  section_id: imaging
  release:
    rule: on_request
    request: order:ct_head
    delay_turns: 1
  content:
    from_fact: f.imaging.ct_head
  interpretation: A normal scan does not remove the need for observation in a patient on a blood thinner.
  linked_fact_ids:
  - f.imaging.ct_head
  synthetic: true
- artifact_id: art.ethanol
  kind: lab_report
  title: Blood alcohol level
  section_id: labs
  release:
    rule: on_request
    request: order:ethanol
  rows_from: &id005
  - f.lab.ethanol
  interpretation: A level above zero shows recent drinking; it does not by itself explain the fall.
  linked_fact_ids: *id005
  synthetic: true
  include:
    requires: f.concealed.alcohol_before_fall
objectives:
- objective_id: obj.mechanism
  criterion: Establishes the mechanism, function since the injury, and whether the head was hit
  kind: elicit_fact
  linked_fact_ids:
  - f.hpi.mechanism
  - f.hpi.function
  - f.hpi.head_injury
  evidence_rule: met when all are elicited
  critical: true
  rubric_domain: gathering
- objective_id: obj.anticoagulant
  criterion: Asks specifically what medicines the patient takes, including blood thinners
  kind: safety
  linked_fact_ids:
  - f.medications.current
  evidence_rule: met when elicited
  critical: true
  rubric_domain: gathering
- objective_id: obj.concealed
  criterion: Establishes whether alcohol was involved
  kind: elicit_fact
  linked_fact_ids:
  - f.concealed.alcohol_before_fall
  evidence_rule: met when disclosed; partly when asked but the denial is accepted
  rubric_domain: listening
- objective_id: obj.tests
  criterion: Examines the injured part and requests appropriate imaging
  kind: action
  linked_requests:
  - exam:msk
  - order:xray
  evidence_rule: met when both are requested
  critical: true
  rubric_domain: reasoning
- objective_id: obj.disposition
  criterion: Chooses a disposition that fits the injury
  kind: reasoning
  linked_fact_ids:
  - f.imaging.xray
  evidence_rule: disposition matches the case's expected disposition, with a summary naming the key findings
  critical: true
  rubric_domain: reasoning
- objective_id: obj.background
  criterion: Checks medicines and allergies
  kind: safety
  linked_fact_ids:
  - f.medications.current
  - f.allergies.drug
  evidence_rule: met when both are asked
  critical: true
  rubric_domain: gathering
  feedback_missed: Ask every patient what they take and what they are allergic to.
- objective_id: obj.rapport
  criterion: Acknowledges the patient's feelings and uses non-judging language
  kind: communication
  evidence_rule: empathic or normalising statements in the transcript
  rubric_domain: rapport
- objective_id: obj.structure
  criterion: 'Runs a structured interview: introduction, open question first, summary, clear close'
  kind: sequencing
  evidence_rule: 'three of: introduction, early open question, summary, closing'
  rubric_domain: opening
rubric_links:
  rubric_id: default
  domains:
  - opening
  - rapport
  - gathering
  - listening
  - explanation
  - reasoning
  - closure
