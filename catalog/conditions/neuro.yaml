# Condition template (catalog/conditions). SYNTHETIC teaching content authored for HospitalGym; needs faculty review.
# Generated by encounter/tools/build_templates.py - edit there or here; `facts` is read by the simulator (latent truth)
# and by encounter.templates.instantiate_case. Reference intervals: see `sources`. Everything else: authored, unsourced.
schema_version: 1
entity_type: condition
id: neuro
condition_group: neuro
label: Headache, weakness or speech disturbance
description: Adult with a neurological complaint, from migraine to transient ischaemic attack to acute stroke.
synthetic: true
needs_faculty_review: true
authoring_note: Synthetic teaching template authored for HospitalGym. Reference intervals follow the listed open-access sources; abnormal-band values, wording, findings
  and artifacts are authored, unsourced, and need faculty review before teaching use.
variants:
  mild:
    label: Mild (severity below 1/3)
    attributes:
      severity_range:
        value:
        - 0.0
        - 0.333
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  moderate:
    label: Moderate (severity 1/3 to 2/3)
    attributes:
      severity_range:
        value:
        - 0.333
        - 0.667
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
  severe:
    label: Severe (severity above 2/3)
    attributes:
      severity_range:
        value:
        - 0.667
        - 1.0
        unit: fraction
        source: assumed
        citation: Band boundaries chosen for this project
complaint_label: neurological symptoms
match_keywords:
- stroke
- weakness
- numbness
- speech
- slurred
- headache
- migraine
- tia
- seizure
- dizzy
- confusion
- facial droop
- multiple sclerosis
- ms
diagnoses:
- band: mild
  diagnosis: Migraine with aura
  expected_disposition: discharge
  expected_orders:
  - exam:neuro
  differential:
  - Migraine
  - Tension headache
  - Subarachnoid haemorrhage
  label: Migraine with aura
- band: moderate
  diagnosis: Transient ischaemic attack
  expected_disposition: admit
  expected_orders:
  - exam:neuro
  - order:glucose
  - order:ct_head
  - order:ecg
  differential:
  - Transient ischaemic attack
  - Low blood sugar
  - Migraine aura
  - Seizure
  label: Transient ischaemic attack
- band: severe
  diagnosis: Acute ischaemic stroke
  expected_disposition: admit
  expected_orders:
  - exam:neuro
  - order:glucose
  - order:ct_head
  - order:ecg
  differential:
  - Ischaemic stroke
  - Intracranial bleeding
  - Low blood sugar
  - Seizure with weakness
  label: Acute ischaemic stroke
teaching_points:
- 'Note the time symptoms began: the most effective stroke treatments are time-limited.'
- Sudden weakness of the face, arm or leg, or trouble speaking, is a stroke until shown otherwise.
- Symptoms that have resolved still need urgent assessment.
typical_concealments:
- f.concealed.missed_medicines
