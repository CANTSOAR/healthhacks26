teaching_points:
- Pain that starts around the navel and moves to the right lower abdomen, with loss of appetite, suggests appendicitis.
- Test for pregnancy in women of child-bearing age before imaging.
- When the blood tests do not fit the stated alcohol intake, raise it without judgement.
