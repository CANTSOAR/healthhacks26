diagnoses:
- band: mild
  diagnosis: Newly recognised high blood sugar without acidosis
  expected_disposition: discharge
  expected_orders:
  - order:glucose
  differential:
  - Type 2 diabetes
  - Urinary infection
  - Thyroid disease
  label: Newly recognised high blood sugar without acidosis
- band: moderate
  diagnosis: Marked hyperglycaemia without ketoacidosis
  expected_disposition: admit
  expected_orders:
  - order:glucose
  - order:bmp
  - order:urinalysis
  differential:
  - Uncontrolled diabetes
  - Early ketoacidosis
  - Infection as a trigger
  label: Marked hyperglycaemia without ketoacidosis
- band: severe
  diagnosis: Diabetic ketoacidosis
  expected_disposition: admit
  expected_orders:
  - order:glucose
  - order:bmp
  - order:urinalysis
  - order:abg
  differential:
  - Diabetic ketoacidosis
  - Sepsis
  - Acute abdomen
  label: Diabetic ketoacidosis
teaching_points:
- Thirst, frequent urination, vomiting and deep rapid breathing in a person with diabetes suggest ketoacidosis.
- Missed insulin is a common trigger; cost is a common reason. Ask without blame.
- Look for the trigger as well as treating the numbers.
