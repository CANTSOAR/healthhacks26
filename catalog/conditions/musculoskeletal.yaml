  - Lumbar radiculopathy
  - Hip disease
  label: Sciatica from a lumbar disc protrusion
- band: severe
  diagnosis: Cauda equina compression from a spinal lesion
  expected_disposition: admit
  expected_orders:
  - exam:msk
  - exam:abdomen
  - order:mri
  - order:crp
  differential:
  - Cauda equina syndrome
  - Spinal metastasis
  - Spinal infection
  label: Cauda equina compression from a spinal lesion
teaching_points:
- Most acute low back pain needs no imaging at the first visit.
- Loss of bladder or bowel control, numbness around the saddle area, weight loss, a history of cancer or fever are warning signs that change everything.
- Embarrassing symptoms come out when the clinician explains why the question matters.
