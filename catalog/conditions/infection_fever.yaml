        citation: Band boundaries chosen for this project
complaint_label: fever
match_keywords:
- fever
- infection
- sepsis
- uti
- urinary
- pyelonephritis
- chills
- flu
- cellulitis
- burning when urinating
diagnoses:
- band: mild
  diagnosis: Uncomplicated urinary tract infection
  expected_disposition: discharge
  expected_orders:
  - order:urinalysis
  differential:
  - Cystitis
  - Sexually transmitted infection
  - Vaginitis
  label: Uncomplicated urinary tract infection
- band: moderate
  diagnosis: Acute pyelonephritis
  expected_disposition: discharge
  expected_orders:
  - order:urinalysis
  - order:cbc
  - exam:abdomen
  differential:
  - Pyelonephritis
  - Kidney stone with infection
  - Appendicitis
  label: Acute pyelonephritis
- band: severe
  diagnosis: Sepsis from a urinary source
  expected_disposition: admit
  expected_orders:
  - order:urinalysis
  - order:cbc
  - order:lactate
  - order:bmp
  - order:blood_cultures
  differential:
  - Urosepsis
  - Obstructed infected kidney
  - Other source of sepsis
  label: Sepsis from a urinary source
teaching_points:
- Fever with a fast heart rate, fast breathing, low blood pressure or new confusion should prompt a search for sepsis.
- Ask what treatment has already been tried, and whether it was finished.
- A raised lactate changes the urgency.
