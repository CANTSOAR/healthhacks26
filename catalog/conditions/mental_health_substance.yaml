  label: Severe alcohol withdrawal with seizure and hallucinations
teaching_points:
- 'Withdrawal usually begins within hours of the last drink and peaks at 24 to 72 hours: the time of the last drink matters.'
- People under-report drinking when they expect judgement; normalise and ask for a typical day.
- Ask every patient in this situation about thoughts of self-harm, directly.
