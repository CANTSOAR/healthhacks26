objectives:
- objective_id: obj.quantity
  criterion: Establishes how much alcohol the patient really drinks
  kind: elicit_fact
  linked_fact_ids:
  - f.concealed.alcohol_quantity
  evidence_rule: met when disclosed; partly when asked but the first answer is accepted
  critical: true
  rubric_domain: listening
  feedback_missed: The first answer minimised. Normalise the question ('I ask everyone'), acknowledge how hard it is to talk about, and ask again for a typical day.
- objective_id: obj.last_drink
  criterion: Establishes the time of the last drink and previous withdrawal problems
  kind: elicit_fact
  linked_fact_ids:
  - f.concealed.last_drink
  - f.hpi.previous_withdrawal
  evidence_rule: met when both are elicited
  critical: true
  rubric_domain: gathering
- objective_id: obj.risk
  criterion: Asks directly about thoughts of self-harm
  kind: safety
  linked_fact_ids:
  - f.concealed.self_harm_thoughts
  evidence_rule: met when elicited; partly when asked but the patient does not open up
  critical: true
  rubric_domain: rapport
- objective_id: obj.tests
  criterion: Examines for signs of withdrawal and requests blood tests
  kind: action
  linked_requests:
  - exam:general
  - order:bmp
  - order:lft
  evidence_rule: met when all are requested
  rubric_domain: reasoning
- objective_id: obj.disposition
  criterion: Chooses a disposition that fits the withdrawal risk
  kind: reasoning
  linked_fact_ids:
  - f.exam.general
  - f.hpi.previous_withdrawal
  evidence_rule: disposition matches the case's expected disposition, with a summary naming the key findings
  critical: true
  rubric_domain: reasoning
- objective_id: obj.background
  criterion: Checks medicines and allergies
  kind: safety
  linked_fact_ids:
  - f.medications.current
  - f.allergies.drug
  evidence_rule: met when both are asked
  critical: true
  rubric_domain: gathering
  feedback_missed: Ask every patient what they take and what they are allergic to.
- objective_id: obj.rapport
  criterion: Acknowledges the patient's feelings and uses non-judging language
  kind: communication
  evidence_rule: empathic or normalising statements in the transcript
  rubric_domain: rapport
- objective_id: obj.structure
  criterion: 'Runs a structured interview: introduction, open question first, summary, clear close'
  kind: sequencing
  evidence_rule: 'three of: introduction, early open question, summary, closing'
  rubric_domain: opening
