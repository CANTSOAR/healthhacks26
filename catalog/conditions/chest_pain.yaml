      patient_answer: I've had a sharp pain on the left side of my chest since yesterday. It catches when I breathe in deep.
    moderate:
    - statement: Central chest tightness on and off for three days, brought on by exertion
      patient_answer: My chest has been getting tight, on and off for three days. Mostly when I'm rushing around.
    severe:
    - statement: Heavy central chest pressure for about an hour
      patient_answer: There's a heavy pressure in the middle of my chest. It's been about an hour and it's not going away.
  polarity: positive
