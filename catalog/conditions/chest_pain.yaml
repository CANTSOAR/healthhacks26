- chest pressure
- chest tightness
- heart attack
- angina
- acs
- palpitations
- cardiac
diagnoses:
- band: mild
  diagnosis: Musculoskeletal chest wall pain
  expected_disposition: discharge
  expected_orders:
  - order:ecg
  - exam:cardiac
  differential:
  - Chest wall strain
  - Pleurisy
  - Acute coronary syndrome
  label: Musculoskeletal chest wall pain
- band: moderate
  diagnosis: Possible unstable angina
  expected_disposition: admit
  expected_orders:
  - order:ecg
  - order:troponin
  differential:
  - Unstable angina
  - Stable angina
  - Reflux
  label: Possible unstable angina
- band: severe
  diagnosis: Acute coronary syndrome (non-ST-elevation)
  expected_disposition: admit
  expected_orders:
  - order:ecg
  - order:troponin
  differential:
  - Non-ST-elevation myocardial infarction
  - Aortic dissection
  - Pulmonary embolism
  label: Acute coronary syndrome (non-ST-elevation)
teaching_points:
- Chest pressure with sweating, nausea or spread to the arm or jaw needs an ECG and troponin without delay.
- A normal first troponin early after onset does not exclude a heart attack.
- Ask about stimulants in every chest pain patient.
