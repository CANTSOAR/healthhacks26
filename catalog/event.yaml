# Catalog file. Shape: contracts/catalog.schema.json. Every attribute carries a source tag
# (measured | literature | assumed). Wave 0 skeleton: all values are ASSUMED placeholders until the
# data workstream replaces them. Keys are read by the simulator; do not rename, only add.
schema_version: 1
entity_type: event
description: 'Exogenous events. Target sources: CDC FluView for flu waves; literature otherwise.'
variants:
  flu_wave:
    label: Influenza wave
    attributes:
      arrival_multiplier:
        value: 1.1
        unit: x arrivals
        source: literature
        citation: 'CDC FluView, Weekly US Influenza Surveillance Report, week 5 ending 1 Feb 2025 (2024-25 season): 8.0% of emergency department
          visits had a discharge diagnosis of influenza (NSSP) and 7.8% of outpatient visits were for influenza-like illness against a 3.0% baseline, above baseline
          for the tenth consecutive week. If those visits are additional, arrivals rise by 1/(1-0.08) = 1.09.'
        url: https://www.cdc.gov/fluview/surveillance/2025-week-05.html
        range:
        - 1.03
        - 1.25
        note: 'DERIVED: national peak-week share in a severe season, treated as additive. Diagnosed influenza undercounts attributable visits (Schanzer DL, Schwartz
          B, 2013, Acad Emerg Med 20(4):388-97: seasonal influenza about 500 ED visits per 100,000 population a year in Ontario, only 7% of them coded as influenza),
          so the true uplift may be higher; milder seasons are lower.'
      respiratory_share_uplift:
        value: 0.0413
        unit: absolute share
        source: measured
        citation: CDC ILINet weekly weighted percent of outpatient visits for influenza-like illness (wILI), HHS Region 2 (NJ, NY, PR, VI), obtained
          through the Delphi Epidata API mirror; 9 seasons 2014-15 to 2025-26 excluding 2019-20, 2020-21, 2021-22; mean excess of wILI over the off-season
          baseline during the wave weeks (as defined for duration_days), median across seasons, expressed as a share of visits
        url: https://api.delphi.cmu.edu/epidata/fluview/?regions=nat,hhs2&epiweeks=201440-202639
        range:
        - 0.026
        - 0.0999
        note: 'PROXY: ILINet measures influenza-like illness as a share of OUTPATIENT-provider visits (it includes some EDs and urgent care), not the
          respiratory share of this hospital''s ED arrivals. Peak-week excess median 0.0541; peak wILI is 4.39x the off-season baseline (range [3.18,
          8.13]). Wave 0 placeholder was 0.12.'
        file: data/processed/fluview_ili_summary.json
      duration_days:
        value: 63
        unit: days
        source: measured
        citation: CDC ILINet weekly weighted percent of outpatient visits for influenza-like illness (wILI), HHS Region 2 (NJ, NY, PR, VI), obtained
          through the Delphi Epidata API mirror; 9 seasons 2014-15 to 2025-26 excluding 2019-20, 2020-21, 2021-22; per season, number of weeks with
          wILI at or above the off-season baseline (mean of weeks 21-39) plus half of the peak excess, x7; median across seasons
        url: https://api.delphi.cmu.edu/epidata/fluview/?regions=nat,hhs2&epiweeks=201440-202639
        file: data/processed/fluview_ili_summary.json
        range:
        - 28
        - 112
        note: 'Width of the wave at half its height; range = shortest to longest season. National median 77 days. Weeks above baseline + 2 SD (a looser
          definition) median 30 weeks. Per-season values: data/processed/fluview_ili_seasons.csv. Wave 0 placeholder was 42.'
      staff_absence_multiplier:
        value: 1.6
        unit: x absence
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
      frequency_per_year:
        value: 1
        unit: per year
        source: measured
        citation: CDC ILINet weekly weighted percent of outpatient visits for influenza-like illness (wILI), HHS Region 2 (NJ, NY, PR, VI), obtained
          through the Delphi Epidata API mirror; 9 seasons 2014-15 to 2025-26 excluding 2019-20, 2020-21, 2021-22; share of seasons with at least 4
          weeks of wILI above baseline + 2 SD = 1.0; modal peak MMWR week 52
        url: https://api.delphi.cmu.edu/epidata/fluview/?regions=nat,hhs2&epiweeks=201440-202639
        file: data/processed/fluview_ili_summary.json
        note: One wave every season in the seasons used; the peak falls in late December to February.
  mass_casualty:
    label: Mass-casualty incident
    attributes:
      extra_patients:
        value: 40
        unit: patients
        source: literature
        citation: 'Brunner J et al. (2014) Radiology 273(1):78-87: 40 patients presented to Brigham and Women''s Hospital after the 2013 Boston Marathon bombing
          (16 admitted, 24 discharged, 10 emergent operations, no deaths). Upper bound: Lake CK (2025) Trauma Surg Acute Care Open 10:e001786: the 2017 Las Vegas
          shooting injured over 800 people, 413 with gunshot wounds needing immediate treatment, spread over the city''s hospitals, mostly self-transported.'
        url: https://doi.org/10.1148/radiol.14140253
        range:
        - 20
        - 200
        note: 'One hospital''s share of one urban bombing; a city-wide event of the Las Vegas size can send a few hundred to the nearest hospital. Second URL: https://doi.org/10.1136/tsaco-2025-001786'
      window_min:
        value: 180
        unit: minutes
        source: literature
        citation: 'Brunner J et al. (2014) Radiology 273(1):78-87: median time from blast to patient arrival at the hospital 97 min (IQR 43-139) for the 40 Boston
          Marathon bombing patients.'
        url: https://doi.org/10.1148/radiol.14140253
        range:
        - 90
        - 240
        note: 'DERIVED: an inter-quartile spread of 96 min implies arrivals spread over roughly three hours, not 90 minutes. Self-transported casualties (Las Vegas
          2017) arrive faster and unannounced: use the low end for that scenario.'
      acuity_mix:
        value:
        - 0.12
        - 0.33
        - 0.35
        - 0.15
        - 0.05
        unit: fraction
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
        index: acuity_1_to_5
      frequency_per_year:
        value: 0.5
        unit: per year
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  staff_callouts:
    label: Nursing call-outs
    attributes:
      absence_multiplier:
        value: 3.0
        unit: x absence
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
      duration_days:
        value: 7
        unit: days
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  equipment_outage:
    label: CT outage
    attributes:
      equipment:
        value: ct
        unit: type
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; scenario choice
      units_down:
        value: 1
        unit: units
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
      duration_hours:
        value: 36
        unit: hours
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
  discharge_delay:
    label: Ward discharge delays
    attributes:
      inpatient_los_multiplier:
        value: 1.25
        unit: x LOS
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
      duration_days:
        value: 14
        unit: days
        source: assumed
        citation: Placeholder set in Wave 0 so the simulator can run; placeholder
