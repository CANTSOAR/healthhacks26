{
  "uri": "https://github.com/CANTSOAR/healthhacks26/ontology/hospital/0.1",
  "classes": [
    {
      "name": "SourceRecord",
      "description": "A versioned source artifact or endpoint snapshot with its retrieval and reuse context."
    },
    {
      "name": "Assertion",
      "description": "A contextual, attributed statement; its truth, author, review, and visibility are separate."
    },
    {
      "name": "ReviewDecision",
      "description": "A decision by a qualified reviewer about an exact target version and use scope."
    },
    {
      "name": "IdentityMapping",
      "description": "A versioned proposed or reviewed crosswalk between independently identified entities."
    },
    {
      "name": "Organization",
      "description": "A legal or administrative organization, including health system, hospital operator, payer, or partner."
    },
    {
      "name": "Facility",
      "description": "A licensed or otherwise identified care delivery establishment with a defined reporting scope."
    },
    {
      "name": "PhysicalLocation",
      "description": "A physical campus, building, wing, floor, room, or bed space; it is not a service team."
    },
    {
      "name": "ServiceUnit",
      "description": "An organizational service/team with capabilities that may span several physical locations."
    },
    {
      "name": "Resource",
      "description": "An individually tracked reusable resource, such as bed, ventilator, scanner, vehicle, or station."
    },
    {
      "name": "CapacitySnapshot",
      "description": "Capacity at a defined instant/interval, with basis and counted scope preserved."
    },
    {
      "name": "Person",
      "description": "An identified real person or explicitly fictional persona; demographic identity does not imply behavior."
    },
    {
      "name": "RoleAssignment",
      "description": "A person acting in a role for an organization/service during a stated period."
    },
    {
      "name": "Qualification",
      "description": "A documented skill, specialty, training, registration, or credential with verification status."
    },
    {
      "name": "Privilege",
      "description": "A scoped grant of authority for a role/person to perform specified activities at a facility."
    },
    {
      "name": "Shift",
      "description": "Planned or actual availability of a role assignment; neither public identity nor affiliation implies a shift."
    },
    {
      "name": "Patient",
      "description": "A real de-identified subject or synthetic persona whose facts are carried by attributed assertions."
    },
    {
      "name": "Encounter",
      "description": "A bounded care interaction in a setting; linked encounters form a journey."
    },
    {
      "name": "ClinicalConcept",
      "description": "A clinical meaning with optional versioned terminology mappings; code and concept are distinct."
    },
    {
      "name": "Observation",
      "description": "A time-specific observation or measurement with method and interpretation context, not a diagnosis."
    },
    {
      "name": "Order",
      "description": "A request for a clinical or support action, distinct from its eventual performance."
    },
    {
      "name": "ActivityDefinition",
      "description": "A versioned procedure, test, consultation, medication administration, or support activity definition."
    },
    {
      "name": "ActivityPerformance",
      "description": "An actual or simulated execution of an activity, including incomplete and cancelled attempts."
    },
    {
      "name": "ClinicalArtifact",
      "description": "A chart note, report, image, waveform, or document with authored and released times and access rights."
    },
    {
      "name": "ConsentDecision",
      "description": "A scoped, time-bound consent/refusal decision with decision-maker and communication context."
    },
    {
      "name": "Perspective",
      "description": "A person-expressed or explicitly authored belief, goal, concern, preference, or barrier."
    },
    {
      "name": "PathwayDefinition",
      "description": "A versioned workflow graph with stages, permissible transitions, authority, and exceptions."
    },
    {
      "name": "PolicyRule",
      "description": "A contextual prerequisite, authority, routing, eligibility, or contingency rule with explicit effects."
    },
    {
      "name": "Decision",
      "description": "A choice made by an identified actor, preserving available alternatives and rationale."
    },
    {
      "name": "Event",
      "description": "An immutable occurrence with occurrence and recording time, references, and causal predecessors."
    },
    {
      "name": "QueueEntry",
      "description": "A wait for a specified service/resource; entry, exit, and censoring are distinguished."
    },
    {
      "name": "ResourceAllocation",
      "description": "A reservation or active allocation of capacity, a resource, or role to an activity over time."
    },
    {
      "name": "Disruption",
      "description": "A bounded outage, shortage, surge, or absence affecting dependencies and available service."
    },
    {
      "name": "InventoryLot",
      "description": "A stock lot of medication, blood product, supply, or consumable with unit and expiry."
    },
    {
      "name": "InventoryMovement",
      "description": "An auditable receipt, consumption, transfer, disposal, or adjustment of stock."
    },
    {
      "name": "Specimen",
      "description": "A collected or requested biological specimen with patient linkage and chain-of-custody events."
    },
    {
      "name": "InsurancePlan",
      "description": "A versioned insurance product; benefits and network depend on dates and service context."
    },
    {
      "name": "Coverage",
      "description": "A subject-specific enrollment/eligibility assertion with period and verification state."
    },
    {
      "name": "NetworkParticipation",
      "description": "Date- and product-specific participation of a facility or professional in a network."
    },
    {
      "name": "Authorization",
      "description": "A request and decision for payer authorization with scope and expiration, not guaranteed payment."
    },
    {
      "name": "FinancialAmount",
      "description": "A contextual amount with explicit economic meaning, currency, scope, and methodology."
    },
    {
      "name": "Claim",
      "description": "A versioned submission for payment, with coded line items and adjudication state."
    },
    {
      "name": "Settlement",
      "description": "A payment, adjustment, denial, refund, or patient obligation associated with claim lines."
    },
    {
      "name": "Appeal",
      "description": "A review request for a coverage, authorization, or claim decision with time and outcome."
    },
    {
      "name": "GeographicArea",
      "description": "A versioned administrative or statistical area; place, tract, county, ZIP and ZCTA remain distinct."
    },
    {
      "name": "PopulationDefinition",
      "description": "An explicit inclusion/exclusion, geography, time, and denominator definition for a cohort."
    },
    {
      "name": "CommunityService",
      "description": "A community or post-acute service with location, eligibility, accessibility, and referral process."
    },
    {
      "name": "DischargePlan",
      "description": "A patient-specific disposition plan, goals, readiness, blockers, and follow-up requirements."
    },
    {
      "name": "Referral",
      "description": "A request for another service, placement, transport, or follow-up with acceptance status."
    },
    {
      "name": "MeasureDefinition",
      "description": "A versioned definition of a count, ratio, outcome, experience, safety, or operational metric."
    },
    {
      "name": "MeasureResult",
      "description": "A measured or modeled statistic with population, reporting period, suppression, and uncertainty."
    },
    {
      "name": "QualitativeFinding",
      "description": "An attributed theme, reported experience, exception, or practice from a described method and context."
    },
    {
      "name": "SafetyEvent",
      "description": "A reported incident or near miss whose attribution and causal analysis have explicit review state."
    },
    {
      "name": "LearningObjective",
      "description": "An observable learner capability tied to expected context and evidence."
    },
    {
      "name": "ScenarioTemplate",
      "description": "A versioned reusable teaching situation with permitted variation and completion rules."
    },
    {
      "name": "CaseVersion",
      "description": "An immutable authored patient scenario version, separate from real-world records and encounter state."
    },
    {
      "name": "DisclosureRule",
      "description": "A versioned rule for revealing a case fact to an audience in an encounter context."
    },
    {
      "name": "RubricVersion",
      "description": "An immutable assessment rubric with applicability, observable criteria, scale and N/A rules."
    },
    {
      "name": "Assessment",
      "description": "A versioned judgment of learner behavior linked to specific encounter evidence and rubric."
    },
    {
      "name": "EvidenceArtifact",
      "description": "A permitted transcript span, action record, answer, or observation used in assessment or review."
    },
    {
      "name": "EvaluationCase",
      "description": "A reference test with inputs, expected behavior, prohibited behavior, and reviewer provenance."
    },
    {
      "name": "Parameter",
      "description": "An applicable numeric value or distribution with unit, dependence, uncertainty, and calibration basis."
    },
    {
      "name": "SimulationRun",
      "description": "A reproducible experiment binding exact input versions, assumptions, seeds, model, and outputs."
    },
    {
      "name": "ValidationStudy",
      "description": "An evaluation with purpose, held-out evidence, acceptance criteria and limitations."
    }
  ],
